<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 17</title>
</head>
<body>
    <form action="submit.php" method="POST">
        <input type="text" name="name" minlength="5" maxlength="20" placeholder="Full name" required>
        <br><br>
        
        <input type="email" name="email" placeholder="you@college.edu" required>
        <br><br>
        
        <input type="tel" name="mobile" placeholder="10-digit mobile" maxlength="10" pattern="[0-9]{10}" 
               title="Enter exactly 10 digits" 
               oninvalid="this.setCustomValidity('Enter exactly 10 digits')" 
               oninput="this.setCustomValidity('')" required>
        <br><br>
        
        <input type="password" name="pass" minlength="6" placeholder="Min 6 characters" required>
        <br><br>
        
        <input type="number" name="age" placeholder="Age (17-30)" min="17" max="30" required>
        <br><br>
        
        <input type="submit" value="Register" name="Register">
    </form>
</body>
</html>
