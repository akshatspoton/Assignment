<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Assignment 7</title>
  <style>
    ul {
      list-style-type: none; /* Removes bullet points */
      margin: 0;
      padding: 0;
      background-color: #333; /* Dark background bar */
      display: flex; /* Aligns list items horizontally */
    }

    li a {
      display: block;
      color: white;
      text-decoration: none; /* Removes link underline */
      padding: 12px 16px; /* Adds spacing around each item */
    }

    li a:hover {
      background-color: #111; /* Optional hover effect */
    }
  </style>
</head>
<body>

  <ul>
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Courses</a></li>
    <li><a href="#">Contact</a></li>
  </ul>

</body>
</html>
